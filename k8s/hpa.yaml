apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: country-integration-hpa
  namespace: country-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: country-integration
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60