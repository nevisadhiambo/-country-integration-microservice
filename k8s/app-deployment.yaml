apiVersion: apps/v1
kind: Deployment
metadata:
  name: country-integration
  namespace: country-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: country-integration
  template:
    metadata:
      labels:
        app: country-integration
    spec:
      containers:
        - name: country-integration
          image: nevisadhiambo/country-integration:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: country-app-config
            - secretRef:
                name: country-app-secret
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: country-integration-service
  namespace: country-app
spec:
  selector:
    app: country-integration
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer