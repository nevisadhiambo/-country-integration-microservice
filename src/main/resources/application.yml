server:
  port: 8080

spring:
  application:
    name: country-integration
  datasource:
    url: jdbc:mysql://localhost:3306/country_db?useSSL=false&serverTimezone=UTC
    username: countryapp
    password: StrongPass123!
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true